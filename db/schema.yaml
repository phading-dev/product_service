- kind: Message
  name: Season
  fields:
    - name: seasonId
      type: string
      index: 1
    - name: publisherId
      type: string
      index: 2
    - name: state
      type: SeasonState
      import: "@phading/product_service_interface/show/season_state"
      index: 3
    - name: name
      type: string
      index: 4
    - name: coverImageR2Filename
      type: string
      index: 5
    - name: totalEpisodes
      type: number
      index: 6
    - name: lastChangeTimeMs
      type: number
      index: 7
- kind: Message
  name: SeasonMore
  fields:
    - name: seasonId
      type: string
      index: 1
    - name: description
      type: string
      index: 2
    - name: createdTimeMs
      type: number
      index: 3
- kind: Message
  name: SeasonGrade
  fields:
    - name: seasonId
      type: string
      index: 1
    - name: gradeId
      type: string
      index: 2
    - name: startDate # ISO string. Inclusive.
      type: string
      index: 3
    - name: endDate # ISO string. Exclusive.
      type: string
      index: 4
    - name: grade # From 1 to 99. A multiplier on the base price.
      type: number
      index: 5
- kind: Message
  name: Episode
  fields:
    - name: seasonId
      type: string
      index: 1
    - name: episodeId
      type: string
      index: 2
    - name: index
      type: number
      index: 3
    - name: name
      type: string
      index: 4
    - name: videoContainerId
      type: string
      index: 5
    - name: videoContainer
      type: VideoContainer
      import: "@phading/product_service_interface/show/video_container"
      index: 6
    - name: premierTimeMs
      type: number
      index: 7
    - name: publishTimeMs
      type: number
      index: 8
- kind: SpannerDatabase
  name: ProductDatabase
  tables:
    - kind: MessageTable
      name: Season
      storedInColumn: data
      columns:
        - seasonId
        - publisherId
        - state
        - lastChangeTimeMs
      primaryKeys:
        - seasonId
      indexes:
        - name: ByLastChangeTimeMs
          columns:
            - publisherId
            - state
            - name: lastChangeTimeMs
              desc: true
        - name: ByPublisher
          columns:
            - publisherId
      insertStatementName: InsertSeason
      deleteStatementName: DeleteSeason
      getStatementName: GetSeason
      updateStatementName: UpdateSeason
    - kind: MessageTable
      name: SeasonMore
      storedInColumn: data
      columns:
        - seasonId
      primaryKeys:
        - seasonId
      insertStatementName: InsertSeasonMore
      deleteStatementName: DeleteSeasonMore
      getStatementName: GetSeasonMore
      updateStatementName: UpdateSeasonMore
    - kind: MessageTable
      name: SeasonGrade
      storedInColumn: data
      columns:
        - seasonId
        - gradeId
        - startDate
        - endDate
      primaryKeys:
        - seasonId
        - gradeId
      interleave:
        parentTable: Season
        cascadeOnDelete: true
      indexes:
        - name: ByEndDate
          columns:
            - name: endDate
              desc: true
            - startDate
      insertStatementName: InsertSeasonGrade
      updateStatementName: UpdateSeasonGrade
    - kind: MessageTable
      name: Episode
      storedInColumn: data
      columns:
        - seasonId
        - episodeId
        - index
        - publishTimeMs
      primaryKeys:
        - seasonId
        - episodeId
      interleave:
        parentTable: Season
        cascadeOnDelete: true
      indexes:
        - name: ByIndex
          columns:
            - name: index
              desc: true
      insertStatementName: InsertEpisode
      deleteStatementName: DeleteEpisode
      getStatementName: GetEpisode
      updateStatementName: UpdateEpisode
    - kind: Table
      name: CoverImageFile
      columns:
        - name: r2Filename
          type: string
      primaryKeys:
        - r2Filename
    - kind: Table
      name: VideoContainerKey
      columns:
        - name: key
          type: string
      primaryKeys:
        - key
    - kind: Table
      name: VideoContainerCreatingTask
      columns:
        - name: seasonId
          type: string
        - name: episodeId
          type: string
        - name: executionTimeMs
          type: timestamp
        - name: createdTimeMs
          type: timestamp
      primaryKeys:
        - seasonId
        - episodeId
      indexes:
        - name: CreatingTaskByExecutionTimeMs
          columns:
            - executionTimeMs
    - kind: Table
      name: VideoContainerDeletingTask
      columns:
        - name: videoContainerId
          type: string
        - name: executionTimeMs
          type: timestamp
        - name: createdTimeMs
          type: timestamp
      primaryKeys:
        - videoContainerId
      indexes:
        - name: DeletingTaskByExecutionTimeMs
          columns:
            - executionTimeMs
    - kind: Table
      name: CoverImageDeletingTask
      columns:
        - name: r2Filename
          type: string
        - name: executionTimeMs
          type: timestamp
        - name: createdTimeMs
          type: timestamp
      primaryKeys:
        - r2Filename
      indexes:
        - name: CoverImageDeletingTaskByExecutionTimeMs
          columns:
            - executionTimeMs
  inserts:
    - name: InsertCoverImageFile
      table: CoverImageFile
      setColumns:
        - r2Filename
    - name: InsertVideoContainerKey
      table: VideoContainerKey
      setColumns:
        - key
    - name: InsertVideoContainerCreatingTask
      table: VideoContainerCreatingTask
      setColumns:
        - seasonId
        - episodeId
        - executionTimeMs
        - createdTimeMs
    - name: InsertVideoContainerDeletingTask
      table: VideoContainerDeletingTask
      setColumns:
        - videoContainerId
        - executionTimeMs
        - createdTimeMs
    - name: InsertCoverImageDeletingTask
      table: CoverImageDeletingTask
      setColumns:
        - r2Filename
        - executionTimeMs
        - createdTimeMs
  updates:
    - name: UpdateVideoContainerCreatingTask
      table: VideoContainerCreatingTask
      where:
        op: AND
        exps:
          - op: =
            leftColumn: seasonId
          - op: =
            leftColumn: episodeId
      setColumns:
        - executionTimeMs
    - name: UpdateVideoContainerDeletingTask
      table: VideoContainerDeletingTask
      where:
        op: =
        leftColumn: videoContainerId
      setColumns:
        - executionTimeMs
    - name: UpdateCoverImageDeletingTask
      table: CoverImageDeletingTask
      where:
        op: =
        leftColumn: r2Filename
      setColumns:
        - executionTimeMs
  deletes:
    - name: DeleteAllEpisodes
      table: Episode
      where:
        op: =
        leftColumn: seasonId
    - name: DeleteCoverImageFile
      table: CoverImageFile
      where:
        op: =
        leftColumn: r2Filename
    - name: DeleteVideoContainerKey
      table: VideoContainerKey
      where:
        op: =
        leftColumn: key
    - name: DeleteVideoContainerCreatingTask
      table: VideoContainerCreatingTask
      where:
        op: AND
        exps:
          - op: =
            leftColumn: seasonId
          - op: =
            leftColumn: episodeId
    - name: DeleteVideoContainerDeletingTask
      table: VideoContainerDeletingTask
      where:
        op: =
        leftColumn: videoContainerId
    - name: DeleteCoverImageDeletingTask
      table: CoverImageDeletingTask
      where:
        op: =
        leftColumn: r2Filename
  selects:
    # Season
    - name: GetSeasonPublisher
      table: Season
      where:
        op: =
        leftColumn: seasonId
      getColumns:
        - publisherId
    - name: GetSeasonForPublisher
      table: Season
      where:
        op: AND
        exps:
          - op: =
            leftColumn: publisherId
          - op: =
            leftColumn: seasonId
      getColumns:
        - data
    - name: GetPublishedSeasonAndMoreForConsumer
      table:
        name: Season
        as: s
      join:
        - type: INNER
          table:
            name: SeasonMore
            as: m
          on:
            op: =
            leftColumn:
              name: seasonId
              table: s
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: seasonId
              table: s
          - op: =
            leftColumn:
              name: state
              table: s
      getColumns:
        - name: data
          table: s
        - name: data
          table: m
    - name: GetSeasonAndMoreForPublisher
      table:
        name: Season
        as: s
      join:
        - type: INNER
          table:
            name: SeasonMore
            as: m
          on:
            op: =
            leftColumn:
              name: seasonId
              table: s
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: publisherId
              table: s
          - op: =
            leftColumn:
              name: seasonId
              table: s
      getColumns:
        - name: data
          table: s
        - name: data
          table: m
    - name: ListSeasonsForPublisher
      table: Season
      where:
        op: AND
        exps:
          - op: =
            leftColumn: publisherId
          - op: =
            leftColumn: state
          - op: <
            leftColumn: lastChangeTimeMs
      orderBy:
        - column: lastChangeTimeMs
          desc: true
      withLimit: true
      getColumns:
        - data
    # SeasonGrade
    - name: GetSeasonGrade
      table: SeasonGrade
      where:
        op: AND
        exps:
          - op: =
            leftColumn: seasonId
          - op: "<="
            leftColumn: startDate
          - op: ">"
            leftColumn: endDate
      getColumns:
        - data
    - name: GetLastSeasonGrades
      table: SeasonGrade
      where:
        op: AND
        exps:
          - op: =
            leftColumn: seasonId
          - op: ">"
            leftColumn: endDate
      orderBy:
        - column: endDate
          desc: true
      withLimit: true
      getColumns:
        - data
    # Episode
    - name: GetPublishedEpisodeForConsumer
      table:
        name: Episode
        as: e
      join:
        - type: INNER
          table:
            name: Season
            as: s
          on:
            op: =
            leftColumn:
              name: seasonId
              table: e
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: seasonId
              table: e
          - op: =
            leftColumn:
              name: state
              table: s
          - op: =
            leftColumn:
              name: episodeId
              table: e
          - op: <
            leftColumn:
              name: publishTimeMs
              table: e
      getColumns:
        - name: data
          table: e
    - name: ListNextPublishedEpisodesForConsumer
      table:
        name: Episode
        as: e
      join:
        - type: INNER
          table:
            name: Season
            as: s
          on:
            op: =
            leftColumn:
              name: seasonId
              table: e
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: seasonId
              table: e
          - op: =
            leftColumn:
              name: state
              table: s
          - op: ">"
            leftColumn:
              name: index
              table: e
          - op: <
            leftColumn:
              name: publishTimeMs
              table: e
      orderBy:
        - column:
            name: index
            table: e
      withLimit: true
      getColumns:
        - name: data
          table: e
    - name: ListPrevPublishedEpisodesForConsumer
      table:
        name: Episode
        as: e
      join:
        - type: INNER
          table:
            name: Season
            as: s
          on:
            op: =
            leftColumn:
              name: seasonId
              table: e
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: seasonId
              table: e
          - op: =
            leftColumn:
              name: state
              table: s
          - op: "<"
            leftColumn:
              name: index
              table: e
          - op: <
            leftColumn:
              name: publishTimeMs
              table: e
      orderBy:
        - column:
            name: index
            table: e
          desc: true
      withLimit: true
      getColumns:
        - name: data
          table: e
    - name: ListPrevEpisodesForPublisher
      table:
        name: Episode
        as: e
      join:
        - type: INNER
          table:
            name: Season
            as: s
          on:
            op: =
            leftColumn:
              name: seasonId
              table: e
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: publisherId
              table: s
          - op: =
            leftColumn:
              name: seasonId
              table: e
          - op: "<"
            leftColumn:
              name: index
              table: e
      orderBy:
        - column:
            name: index
            table: e
          desc: true
      withLimit: true
      getColumns:
        - name: data
          table: e
    - name: ListNextEpisodesForPublisher
      table:
        name: Episode
        as: e
      join:
        - type: INNER
          table:
            name: Season
            as: s
          on:
            op: =
            leftColumn:
              name: seasonId
              table: e
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: publisherId
              table: s
          - op: =
            leftColumn:
              name: seasonId
              table: e
          - op: ">"
            leftColumn:
              name: index
              table: e
      orderBy:
        - column:
            name: index
            table: e
      withLimit: true
      getColumns:
        - name: data
          table: e
    - name: GetEpisodeForPublisher
      table:
        name: Episode
        as: e
      join:
        - type: INNER
          table:
            name: Season
            as: s
          on:
            op: =
            leftColumn:
              name: seasonId
              table: e
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: publisherId
              table: s
          - op: =
            leftColumn:
              name: seasonId
              table: e
          - op: =
            leftColumn:
              name: episodeId
              table: e
      getColumns:
        - name: data
          table: e
    - name: GetSeasonAndEpisode
      table:
        name: Episode
        as: e
      join:
        - type: INNER
          table:
            name: Season
            as: s
          on:
            op: =
            leftColumn:
              name: seasonId
              table: e
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: seasonId
              table: e
          - op: =
            leftColumn:
              name: episodeId
              table: e
      getColumns:
        - name: data
          table: s
        - name: data
          table: e
    - name: GetSeasonAndEpisodeForPublisher
      table:
        name: Episode
        as: e
      join:
        - type: INNER
          table:
            name: Season
            as: s
          on:
            op: =
            leftColumn:
              name: seasonId
              table: e
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: publisherId
              table: s
          - op: =
            leftColumn:
              name: seasonId
              table: e
          - op: =
            leftColumn:
              name: episodeId
              table: e
      getColumns:
        - name: data
          table: s
        - name: data
          table: e
    # CoverImageFile
    - name: CheckPresenceOfCoverImageFile
      table: CoverImageFile
      where:
        op: =
        leftColumn: r2Filename
      getColumns:
        - r2Filename
    # VideoContainerKey
    - name: CheckPresenceOfVideoContainerKey
      table: VideoContainerKey
      where:
        op: =
        leftColumn: key
      getColumns:
        - key
    # Tasks
    - name: ListVideoContainerCreatingTasks
      table: VideoContainerCreatingTask
      where:
        op: <=
        leftColumn: executionTimeMs
      orderBy:
        - executionTimeMs
      getColumns:
        - seasonId
        - episodeId
        - executionTimeMs
    - name: ListVideoContainerDeletingTasks
      table: VideoContainerDeletingTask
      where:
        op: <=
        leftColumn: executionTimeMs
      orderBy:
        - executionTimeMs
      getColumns:
        - videoContainerId
        - executionTimeMs
    - name: ListCoverImageDeletingTasks
      table: CoverImageDeletingTask
      where:
        op: <=
        leftColumn: executionTimeMs
      orderBy:
        - executionTimeMs
      getColumns:
        - r2Filename
        - executionTimeMs
  outputDdl: ./db/ddl
  outputSql: ./db/sql
