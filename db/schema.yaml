- kind: SpannerDatabase
  name: ProductDatabase
  tables:
    - kind: Table
      name: Season
      columns:
        - name: seasonId
          type: string
        - name: publisherId
          type: string
          nullable: true
        - name: state
          type: SeasonState
          import: "@phading/product_service_interface/show/season_state"
          nullable: true
        - name: name
          type: string
          nullable: true
        - name: coverImageR2Filename
          type: string
          nullable: true
        - name: totalEpisodes
          type: float64
          nullable: true
        - name: lastChangeTimeMs
          type: float64
          nullable: true
        - name: recentPremierTimeMs
          type: float64
          nullable: true
        - name: description
          type: string
          nullable: true
        - name: createdTimeMs
          type: float64
          nullable: true
      columnGroups:
        - name: main
          columns:
            - seasonId
            - publisherId
            - state
            - name
            - coverImageR2Filename
            - totalEpisodes
            - lastChangeTimeMs
            - recentPremierTimeMs
      primaryKeys:
        - seasonId
      indexes:
        - name: ByLastChangeTimeMs
          columns:
            - publisherId
            - name: lastChangeTimeMs
              desc: true
            - state
        - name: ByRecentPremierTimeMs
          columns:
            - name: recentPremierTimeMs
              desc: true
            - state
      insert: InsertSeason
      delete: DeleteSeason
      get: GetSeason
    - kind: Table
      name: SeasonGrade
      columns:
        - name: seasonId
          type: string
        - name: gradeId
          type: string
        - name: startDate # ISO string. Inclusive.
          type: string
          nullable: true
        - name: endDate # ISO string. Exclusive.
          type: string
          nullable: true
        - name: grade # From 1 to 99. A multiplier on the base price.
          type: float64
          nullable: true
      primaryKeys:
        - seasonId
        - gradeId
      interleave:
        parentTable: Season
        cascadeOnDelete: true
      indexes:
        - name: ByEndDate
          columns:
            - name: endDate
              desc: true
            - startDate
      insert: InsertSeasonGrade
    - kind: Table
      name: Episode
      columns:
        - name: seasonId
          type: string
        - name: episodeId
          type: string
        - name: index
          type: float64
          nullable: true
        - name: name
          type: string
          nullable: true
        - name: videoContainerId
          type: string
          nullable: true
        - name: videoContainer
          type: VideoContainer
          import: "@phading/product_service_interface/show/video_container"
          nullable: true
        - name: premierTimeMs
          type: float64
          nullable: true
        - name: publishTimeMs
          type: float64
          nullable: true
      primaryKeys:
        - seasonId
        - episodeId
      interleave:
        parentTable: Season
        cascadeOnDelete: true
      indexes:
        - name: ByIndex
          columns:
            - name: index
              desc: true
      insert: InsertEpisode
      delete: DeleteEpisode
      get: GetEpisode
    - kind: Table
      name: IndividualSeasonRating
      columns:
        - name: raterId
          type: string
        - name: seasonId
          type: string
        - name: rating
          type: float64
          nullable: true
        - name: ratedTimeMs
          type: float64
          nullable: true
      primaryKeys:
        - raterId
        - seasonId
      insert: InsertIndividualSeasonRating
      delete: DeleteIndividualSeasonRating
      get: GetIndividualSeasonRating
      update: UpdateIndividualSeasonRating
    - kind: Table
      name: SeasonRating
      columns:
        - name: seasonId
          type: string
        - name: totalRatings
          type: float64
          nullable: true
        - name: count
          type: float64
          nullable: true
        - name: averageRating
          type: float64
          nullable: true
        - name: updatedTimeMs
          type: float64
          nullable: true
      primaryKeys:
        - seasonId
      indexes:
        - name: ByRating
          columns:
            - name: averageRating
              desc: true
            - name: updatedTimeMs
              desc: true
      insert: InsertSeasonRating
      delete: DeleteSeasonRating
      get: GetSeasonRating
      update: UpdateSeasonRating
    - kind: Table
      name: CoverImageFile
      columns:
        - name: r2Filename
          type: string
      primaryKeys:
        - r2Filename
      insert: InsertCoverImageFile
      delete: DeleteCoverImageFile
      get: GetCoverImageFile
    - kind: Table
      name: VideoContainerKey
      columns:
        - name: key
          type: string
      primaryKeys:
        - key
      insert: InsertVideoContainerKey
      delete: DeleteVideoContainerKey
      get: GetVideoContainerKey
    - kind: TaskTable
      name: VideoContainerCreatingTask
      columns:
        - name: seasonId
          type: string
        - name: episodeId
          type: string
      retryCountColumn: retryCount
      executionTimeColumn: executionTimeMs
      createdTimeColumn: createdTimeMs
      primaryKeys:
        - seasonId
        - episodeId
      executionTimeIndex: VideoContainerCreatingTaskByExecutionTimeMs
      insert: InsertVideoContainerCreatingTask
      delete: DeleteVideoContainerCreatingTask
      get: GetVideoContainerCreatingTask
      listPendingTasks: ListPendingVideoContainerCreatingTasks
      getMetadata: GetVideoContainerCreatingTaskMetadata
      updateMetadata: UpdateVideoContainerCreatingTaskMetadata
    - kind: TaskTable
      name: VideoContainerDeletingTask
      columns:
        - name: videoContainerId
          type: string
      retryCountColumn: retryCount
      executionTimeColumn: executionTimeMs
      createdTimeColumn: createdTimeMs
      primaryKeys:
        - videoContainerId
      executionTimeIndex: VideoContainerDeletingTaskByExecutionTimeMs
      insert: InsertVideoContainerDeletingTask
      delete: DeleteVideoContainerDeletingTask
      get: GetVideoContainerDeletingTask
      listPendingTasks: ListPendingVideoContainerDeletingTasks
      getMetadata: GetVideoContainerDeletingTaskMetadata
      updateMetadata: UpdateVideoContainerDeletingTaskMetadata
    - kind: TaskTable
      name: CoverImageDeletingTask
      columns:
        - name: r2Filename
          type: string
      retryCountColumn: retryCount
      executionTimeColumn: executionTimeMs
      createdTimeColumn: createdTimeMs
      primaryKeys:
        - r2Filename
      executionTimeIndex: CoverImageDeletingTaskByExecutionTimeMs
      insert: InsertCoverImageDeletingTask
      delete: DeleteCoverImageDeletingTask
      get: GetCoverImageDeletingTask
      listPendingTasks: ListPendingCoverImageDeletingTasks
      getMetadata: GetCoverImageDeletingTaskMetadata
      updateMetadata: UpdateCoverImageDeletingTaskMetadata
  deletes:
    - name: DeleteAllEpisodes
      table: Episode
      where:
        op: =
        lColumn: seasonId
  updates:
    - name: UpdateSeasonLastChangeTime
      table: Season
      where:
        op: =
        lColumn: seasonId
      set:
        - lastChangeTimeMs
    - name: ArchiveSeason
      table: Season
      where:
        op: =
        lColumn: seasonId
      set:
        - state
        - coverImageR2Filename
        - lastChangeTimeMs
    - name: UpdateSeasonTotalEpisodes
      table: Season
      where:
        op: =
        lColumn: seasonId
      set:
        - totalEpisodes
        - lastChangeTimeMs
    - name: PublishSeason
      table: Season
      where:
        op: =
        lColumn: seasonId
      set:
        - state
        - recentPremierTimeMs
        - lastChangeTimeMs
    - name: UpdateSeasonPremierTime
      table: Season
      where:
        op: =
        lColumn: seasonId
      set:
        - recentPremierTimeMs
        - lastChangeTimeMs
    - name: UpdateSeasonNameAndDescription
      table: Season
      where:
        op: =
        lColumn: seasonId
      set:
        - name
        - description
        - lastChangeTimeMs
    - name: UpdateSeasonCoverImage
      table: Season
      where:
        op: =
        lColumn: seasonId
      set:
        - coverImageR2Filename
        - lastChangeTimeMs
    - name: UpdateSeasonGrade
      table: SeasonGrade
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: gradeId
      set:
        - grade
    - name: UpdateSeasonGradeEndDate
      table: SeasonGrade
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: gradeId
      set:
        - endDate
    - name: UpdateSeasonGradeStartDateAndGrade
      table: SeasonGrade
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: gradeId
      set:
        - startDate
        - grade
    - name: UpdateEpisodeVideoContainerId
      table: Episode
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: episodeId
      set:
        - videoContainerId
    - name: UpdateEpisodeVideoContainer
      table: Episode
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: episodeId
      set:
        - videoContainer
    - name: UpdateEpisodeIndex
      table: Episode
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: episodeId
      set:
        - index
    - name: PublishEpisode # Unpublish as well
      table: Episode
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: episodeId
      set:
        - publishTimeMs
        - premierTimeMs
    - name: UpdateEpisodeName
      table: Episode
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: episodeId
      set:
        - name
  selects:
    # Season
    - name: CheckPresenceOfSeason
      from: Season
      where:
        op: =
        lColumn: seasonId
      get:
        - lastChangeTimeMs
    - name: GetSeasonPublisher
      from: Season
      where:
        op: =
        lColumn: seasonId
      get:
        - publisherId
    - name: GetSeasonForPublisher
      from: Season
      where:
        op: AND
        exprs:
          - op: =
            lColumn: publisherId
          - op: =
            lColumn: seasonId
      get:
        - columnGroup: main
    - name: GetSeasonAllAndRatingForPublisher
      from: Season
      as: s
      join:
        - type: LEFT
          with: SeasonRating
          as: sr
          on:
            op: =
            lColumn: seasonId
            lTable: s
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: publisherId
            lTable: s
          - op: =
            lColumn: seasonId
            lTable: s
      get:
        - all: true
          table: s
        - all: true
          table: sr
    - name: ListSeasonsForPublisher
      from: Season
      as: s
      join:
        - type: LEFT
          with: SeasonRating
          as: sr
          on:
            op: =
            lColumn: seasonId
            lTable: s
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: publisherId
            lTable: s
          - op: =
            lColumn: state
            lTable: s
          - op: <
            lColumn: lastChangeTimeMs
            lTable: s
      orderBy:
        - column: lastChangeTimeMs
          table: s
          desc: true
      withLimit: true
      get:
        - columnGroup: main
          table: s
        - all: true
          table: sr
    - name: ListPublishedSeasonsByPublishTimeForConsumer
      from: Season
      as: s
      join:
        - type: LEFT
          with: SeasonRating
          as: sr
          on:
            op: =
            lColumn: seasonId
            lTable: s
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: state
            lTable: s
          - op: <
            lColumn: recentPremierTimeMs
            lTable: s
      orderBy:
        - column: recentPremierTimeMs
          table: s
          desc: true
      withLimit: true
      get:
        - columnGroup: main
          table: s
        - all: true
          table: sr
    - name: ListPublishedSeasonsByRatingForConsumer
      from: Season
      as: s
      join:
        - type: INNER
          with: SeasonRating
          as: sr
          on:
            op: =
            lColumn: seasonId
            lTable: s
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: state
            lTable: s
          - op: OR
            exprs:
              - op: <
                lColumn: averageRating
                lTable: sr
              - op: AND
                exprs:
                  - op: =
                    lColumn: averageRating
                    lTable: sr
                  - op: <
                    lColumn: updatedTimeMs
                    lTable: sr
      orderBy:
        - column: averageRating
          table: sr
          desc: true
        - column: updatedTimeMs
          table: sr
          desc: true
      withLimit: true
      get:
        - columnGroup: main
          table: s
        - all: true
          table: sr
    - name: GetPublishedSeasonAndRatingForConsumer
      from: Season
      as: s
      join:
        - type: LEFT
          with: SeasonRating
          as: sr
          on:
            op: =
            lColumn: seasonId
            lTable: s
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
            lTable: s
          - op: =
            lColumn: state
            lTable: s
      get:
        - columnGroup: main
          table: s
        - all: true
          table: sr
    - name: GetPublishedSeasonAllAndRatingForConsumer
      from: Season
      as: s
      join:
        - type: LEFT
          with: SeasonRating
          as: sr
          on:
            op: =
            lColumn: seasonId
            lTable: s
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
            lTable: s
          - op: =
            lColumn: state
            lTable: s
      get:
        - all: true
          table: s
        - all: true
          table: sr
    # SeasonGrade
    - name: GetSeasonGrade
      from: SeasonGrade
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: "<="
            lColumn: startDate
          - op: ">"
            lColumn: endDate
      get:
        - all: true
    - name: GetLastSeasonGrades
      from: SeasonGrade
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: ">"
            lColumn: endDate
      orderBy:
        - column: endDate
          desc: true
      withLimit: true
      get:
        - all: true
    # Episode
    - name: CheckPresenceOfEpisode
      from: Episode
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: episodeId
      get:
        - publishTimeMs
    - name: GetPublishedEpisodeForConsumer
      from: Episode
      as: e
      join:
        - type: INNER
          with: Season
          as: s
          on:
            op: =
            lColumn: seasonId
            lTable: e
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
            lTable: e
          - op: =
            lColumn: state
            lTable: s
          - op: =
            lColumn: episodeId
            lTable: e
          - op: <
            lColumn: publishTimeMs
            lTable: e
      get:
        - all: true
          table: e
    - name: ListNextPublishedEpisodesForConsumer
      from: Episode
      as: e
      join:
        - type: INNER
          with: Season
          as: s
          on:
            op: =
            lColumn: seasonId
            lTable: e
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
            lTable: e
          - op: =
            lColumn: state
            lTable: s
          - op: ">"
            lColumn: index
            lTable: e
          - op: <
            lColumn: publishTimeMs
            lTable: e
      orderBy:
        - column: index
          table: e
      withLimit: true
      get:
        - all: true
          table: e
    - name: ListPrevPublishedEpisodesForConsumer
      from: Episode
      as: e
      join:
        - type: INNER
          with: Season
          as: s
          on:
            op: =
            lColumn: seasonId
            lTable: e
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
            lTable: e
          - op: =
            lColumn: state
            lTable: s
          - op: "<"
            lColumn: index
            lTable: e
          - op: <
            lColumn: publishTimeMs
            lTable: e
      orderBy:
        - column: index
          table: e
          desc: true
      withLimit: true
      get:
        - all: true
          table: e
    - name: ListPrevEpisodesForPublisher
      from: Episode
      as: e
      join:
        - type: INNER
          with: Season
          as: s
          on:
            op: =
            lColumn: seasonId
            lTable: e
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: publisherId
            lTable: s
          - op: =
            lColumn: seasonId
            lTable: e
          - op: "<"
            lColumn: index
            lTable: e
      orderBy:
        - column: index
          table: e
          desc: true
      withLimit: true
      get:
        - all: true
          table: e
    - name: ListNextEpisodesForPublisher
      from: Episode
      as: e
      join:
        - type: INNER
          with: Season
          as: s
          on:
            op: =
            lColumn: seasonId
            lTable: e
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: publisherId
            lTable: s
          - op: =
            lColumn: seasonId
            lTable: e
          - op: ">"
            lColumn: index
            lTable: e
      orderBy:
        - column: index
          table: e
      withLimit: true
      get:
        - all: true
          table: e
    - name: GetEpisodeForPublisher
      from: Episode
      as: e
      join:
        - type: INNER
          with: Season
          as: s
          on:
            op: =
            lColumn: seasonId
            lTable: e
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: publisherId
            lTable: s
          - op: =
            lColumn: seasonId
            lTable: e
          - op: =
            lColumn: episodeId
            lTable: e
      get:
        - all: true
          table: e
    - name: CheckPresenceOfEpisodeForPublisher
      from: Episode
      as: e
      join:
        - type: INNER
          with: Season
          as: s
          on:
            op: =
            lColumn: seasonId
            lTable: e
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: publisherId
            lTable: s
          - op: =
            lColumn: seasonId
            lTable: e
          - op: =
            lColumn: episodeId
            lTable: e
      get:
        - publishTimeMs
    - name: GetSeasonAndEpisode
      from: Episode
      as: e
      join:
        - type: INNER
          with: Season
          as: s
          on:
            op: =
            lColumn: seasonId
            lTable: e
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
            lTable: e
          - op: =
            lColumn: episodeId
            lTable: e
      get:
        - columnGroup: main
          table: s
        - all: true
          table: e
    - name: GetSeasonAndEpisodeForPublisher
      from: Episode
      as: e
      join:
        - type: INNER
          with: Season
          as: s
          on:
            op: =
            lColumn: seasonId
            lTable: e
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: publisherId
            lTable: s
          - op: =
            lColumn: seasonId
            lTable: e
          - op: =
            lColumn: episodeId
            lTable: e
      get:
        - columnGroup: main
          table: s
        - all: true
          table: e
  outputDdl: ./db/ddl
  outputSql: ./db/sql
