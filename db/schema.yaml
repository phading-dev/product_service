- kind: Message
  name: Season
  fields:
    - name: seasonId
      type: string
      index: 1
    - name: publisherId
      type: string
      index: 2
    - name: state
      type: SeasonState
      import: "@phading/product_service_interface/show/season_state"
      index: 3
    - name: name
      type: string
      index: 4
    - name: coverImageR2Filename
      type: string
      index: 5
    - name: totalEpisodes
      type: number
      index: 6
    - name: lastChangeTimeMs
      type: number
      index: 7
    - name: recentPremierTimeMs
      type: number
      index: 8
- kind: Message
  name: SeasonMore
  fields:
    - name: seasonId
      type: string
      index: 1
    - name: description
      type: string
      index: 2
    - name: createdTimeMs
      type: number
      index: 3
- kind: Message
  name: SeasonGrade
  fields:
    - name: seasonId
      type: string
      index: 1
    - name: gradeId
      type: string
      index: 2
    - name: startDate # ISO string. Inclusive.
      type: string
      index: 3
    - name: endDate # ISO string. Exclusive.
      type: string
      index: 4
    - name: grade # From 1 to 99. A multiplier on the base price.
      type: number
      index: 5
- kind: Message
  name: Episode
  fields:
    - name: seasonId
      type: string
      index: 1
    - name: episodeId
      type: string
      index: 2
    - name: index
      type: number
      index: 3
    - name: name
      type: string
      index: 4
    - name: videoContainerId
      type: string
      index: 5
    - name: videoContainer
      type: VideoContainer
      import: "@phading/product_service_interface/show/video_container"
      index: 6
    - name: premierTimeMs
      type: number
      index: 7
    - name: publishTimeMs
      type: number
      index: 8
- kind: Message
  name: IndividualSeasonRating
  fields:
    - name: raterId
      type: string
      index: 1
    - name: seasonId
      type: string
      index: 2
    - name: rating
      type: number
      index: 3
    - name: ratedTimeMs
      type: number
      index: 4
- kind: Message
  name: SeasonRating
  fields:
    - name: seasonId
      type: string
      index: 1
    - name: totalRatings
      type: number
      index: 2
    - name: count
      type: number
      index: 3
    - name: averageRating
      type: number
      index: 4
    - name: updatedTimeMs
      type: number
      index: 5
- kind: SpannerDatabase
  name: ProductDatabase
  tables:
    - kind: MessageTable
      name: Season
      storedInColumn: data
      columns:
        - seasonId
        - publisherId
        - state
        - lastChangeTimeMs
        - recentPremierTimeMs
      primaryKeys:
        - seasonId
      indexes:
        - name: ByLastChangeTimeMs
          columns:
            - publisherId
            - name: lastChangeTimeMs
              desc: true
            - state
        - name: ByRecentPremierTimeMs
          columns:
            - name: recentPremierTimeMs
              desc: true
            - state
      insert: InsertSeason
      delete: DeleteSeason
      get: GetSeason
      update: UpdateSeason
    - kind: MessageTable
      name: SeasonMore
      storedInColumn: data
      columns:
        - seasonId
      primaryKeys:
        - seasonId
      insert: InsertSeasonMore
      delete: DeleteSeasonMore
      get: GetSeasonMore
      update: UpdateSeasonMore
    - kind: MessageTable
      name: SeasonGrade
      storedInColumn: data
      columns:
        - seasonId
        - gradeId
        - startDate
        - endDate
      primaryKeys:
        - seasonId
        - gradeId
      interleave:
        parentTable: Season
        cascadeOnDelete: true
      indexes:
        - name: ByEndDate
          columns:
            - name: endDate
              desc: true
            - startDate
      insert: InsertSeasonGrade
      update: UpdateSeasonGrade
    - kind: MessageTable
      name: Episode
      storedInColumn: data
      columns:
        - seasonId
        - episodeId
        - index
        - publishTimeMs
      primaryKeys:
        - seasonId
        - episodeId
      interleave:
        parentTable: Season
        cascadeOnDelete: true
      indexes:
        - name: ByIndex
          columns:
            - name: index
              desc: true
      insert: InsertEpisode
      delete: DeleteEpisode
      get: GetEpisode
      update: UpdateEpisode
    - kind: MessageTable
      name: IndividualSeasonRating
      storedInColumn: data
      columns:
        - raterId
        - seasonId
      primaryKeys:
        - raterId
        - seasonId
      insert: InsertIndividualSeasonRating
      delete: DeleteIndividualSeasonRating
      get: GetIndividualSeasonRating
      update: UpdateIndividualSeasonRating
    - kind: MessageTable
      name: SeasonRating
      storedInColumn: data
      columns:
        - seasonId
        - averageRating
        - updatedTimeMs
      primaryKeys:
        - seasonId
      indexes:
        - name: ByRating
          columns:
            - name: averageRating
              desc: true
            - name: updatedTimeMs
              desc: true
      insert: InsertSeasonRating
      delete: DeleteSeasonRating
      get: GetSeasonRating
      update: UpdateSeasonRating
    - kind: Table
      name: CoverImageFile
      columns:
        - name: r2Filename
          type: string
      primaryKeys:
        - r2Filename
    - kind: Table
      name: VideoContainerKey
      columns:
        - name: key
          type: string
      primaryKeys:
        - key
    - kind: TaskTable
      name: VideoContainerCreatingTask
      columns:
        - name: seasonId
          type: string
        - name: episodeId
          type: string
      retryCountColumn: retryCount
      executionTimeColumn: executionTimeMs
      createdTimeColumn: createdTimeMs
      primaryKeys:
        - seasonId
        - episodeId
      executionTimeIndex: VideoContainerCreatingTaskByExecutionTimeMs
      insert: InsertVideoContainerCreatingTask
      delete: DeleteVideoContainerCreatingTask
      get: GetVideoContainerCreatingTask
      listPendingTasks: ListPendingVideoContainerCreatingTasks
      getMetadata: GetVideoContainerCreatingTaskMetadata
      updateMetadata: UpdateVideoContainerCreatingTaskMetadata
    - kind: TaskTable
      name: VideoContainerDeletingTask
      columns:
        - name: videoContainerId
          type: string
      retryCountColumn: retryCount
      executionTimeColumn: executionTimeMs
      createdTimeColumn: createdTimeMs
      primaryKeys:
        - videoContainerId
      executionTimeIndex: VideoContainerDeletingTaskByExecutionTimeMs
      insert: InsertVideoContainerDeletingTask
      delete: DeleteVideoContainerDeletingTask
      get: GetVideoContainerDeletingTask
      listPendingTasks: ListPendingVideoContainerDeletingTasks
      getMetadata: GetVideoContainerDeletingTaskMetadata
      updateMetadata: UpdateVideoContainerDeletingTaskMetadata
    - kind: TaskTable
      name: CoverImageDeletingTask
      columns:
        - name: r2Filename
          type: string
      retryCountColumn: retryCount
      executionTimeColumn: executionTimeMs
      createdTimeColumn: createdTimeMs
      primaryKeys:
        - r2Filename
      executionTimeIndex: CoverImageDeletingTaskByExecutionTimeMs
      insert: InsertCoverImageDeletingTask
      delete: DeleteCoverImageDeletingTask
      get: GetCoverImageDeletingTask
      listPendingTasks: ListPendingCoverImageDeletingTasks
      getMetadata: GetCoverImageDeletingTaskMetadata
      updateMetadata: UpdateCoverImageDeletingTaskMetadata
  inserts:
    - name: InsertCoverImageFile
      table: CoverImageFile
      setColumns:
        - r2Filename
    - name: InsertVideoContainerKey
      table: VideoContainerKey
      setColumns:
        - key
  deletes:
    - name: DeleteAllEpisodes
      table: Episode
      where:
        op: =
        leftColumn: seasonId
    - name: DeleteCoverImageFile
      table: CoverImageFile
      where:
        op: =
        leftColumn: r2Filename
    - name: DeleteVideoContainerKey
      table: VideoContainerKey
      where:
        op: =
        leftColumn: key
  selects:
    # Season
    - name: CheckPresenceOfSeason
      table: Season
      where:
        op: =
        leftColumn: seasonId
      getColumns:
        - lastChangeTimeMs
    - name: GetSeasonPublisher
      table: Season
      where:
        op: =
        leftColumn: seasonId
      getColumns:
        - publisherId
    - name: GetSeasonForPublisher
      table: Season
      where:
        op: AND
        exps:
          - op: =
            leftColumn: publisherId
          - op: =
            leftColumn: seasonId
      getColumns:
        - data
    - name: GetSeasonAndMoreAndRatingForPublisher
      table:
        name: Season
        as: s
      join:
        - type: INNER
          table:
            name: SeasonMore
            as: m
          on:
            op: =
            leftColumn:
              name: seasonId
              table: s
            rightColumn: seasonId
        - type: LEFT
          table:
            name: SeasonRating
            as: sr
          on:
            op: =
            leftColumn:
              name: seasonId
              table: s
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: publisherId
              table: s
          - op: =
            leftColumn:
              name: seasonId
              table: s
      getColumns:
        - name: data
          table: s
        - name: data
          table: m
        - name: data
          table: sr
    - name: ListSeasonsForPublisher
      table:
        name: Season
        as: s
      join:
        - type: LEFT
          table:
            name: SeasonRating
            as: sr
          on:
            op: =
            leftColumn:
              name: seasonId
              table: s
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: publisherId
              table: s
          - op: =
            leftColumn:
              name: state
              table: s
          - op: <
            leftColumn:
              name: lastChangeTimeMs
              table: s
      orderBy:
        - column:
            name: lastChangeTimeMs
            table: s
          desc: true
      withLimit: true
      getColumns:
        - name: data
          table: s
        - name: data
          table: sr
    - name: ListPublishedSeasonsByPublishTimeForConsumer
      table:
        name: Season
        as: s
      join:
        - type: LEFT
          table:
            name: SeasonRating
            as: sr
          on:
            op: =
            leftColumn:
              name: seasonId
              table: s
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: state
              table: s
          - op: <
            leftColumn:
              name: recentPremierTimeMs
              table: s
      orderBy:
        - column:
            name: recentPremierTimeMs
            table: s
          desc: true
      withLimit: true
      getColumns:
        - name: data
          table: s
        - name: data
          table: sr
    - name: ListPublishedSeasonsByRatingForConsumer
      table:
        name: Season
        as: s
      join:
        - type: INNER
          table:
            name: SeasonRating
            as: sr
          on:
            op: =
            leftColumn:
              name: seasonId
              table: s
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: state
              table: s
          - op: OR
            exps:
              - op: <
                leftColumn:
                  name: averageRating
                  table: sr
              - op: AND
                exps:
                  - op: =
                    leftColumn:
                      name: averageRating
                      table: sr
                  - op: <
                    leftColumn:
                      name: updatedTimeMs
                      table: sr
      orderBy:
        - column:
            name: averageRating
            table: sr
          desc: true
        - column:
            name: updatedTimeMs
            table: sr
          desc: true
      withLimit: true
      getColumns:
        - name: data
          table: s
        - name: data
          table: sr
    - name: GetPublishedSeasonAndRatingForConsumer
      table:
        name: Season
        as: s
      join:
        - type: LEFT
          table:
            name: SeasonRating
            as: sr
          on:
            op: =
            leftColumn:
              name: seasonId
              table: s
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: seasonId
              table: s
          - op: =
            leftColumn:
              name: state
              table: s
      getColumns:
        - name: data
          table: s
        - name: data
          table: sr
    - name: GetPublishedSeasonAndMoreAndRatingForConsumer
      table:
        name: Season
        as: s
      join:
        - type: INNER
          table:
            name: SeasonMore
            as: m
          on:
            op: =
            leftColumn:
              name: seasonId
              table: s
            rightColumn: seasonId
        - type: LEFT
          table:
            name: SeasonRating
            as: sr
          on:
            op: =
            leftColumn:
              name: seasonId
              table: s
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: seasonId
              table: s
          - op: =
            leftColumn:
              name: state
              table: s
      getColumns:
        - name: data
          table: s
        - name: data
          table: m
        - name: data
          table: sr
    # SeasonGrade
    - name: GetSeasonGrade
      table: SeasonGrade
      where:
        op: AND
        exps:
          - op: =
            leftColumn: seasonId
          - op: "<="
            leftColumn: startDate
          - op: ">"
            leftColumn: endDate
      getColumns:
        - data
    - name: GetLastSeasonGrades
      table: SeasonGrade
      where:
        op: AND
        exps:
          - op: =
            leftColumn: seasonId
          - op: ">"
            leftColumn: endDate
      orderBy:
        - column: endDate
          desc: true
      withLimit: true
      getColumns:
        - data
    # Episode
    - name: CheckPresenceOfEpisode
      table: Episode
      where:
        op: AND
        exps:
          - op: =
            leftColumn: seasonId
          - op: =
            leftColumn: episodeId
      getColumns:
        - publishTimeMs
    - name: GetPublishedEpisodeForConsumer
      table:
        name: Episode
        as: e
      join:
        - type: INNER
          table:
            name: Season
            as: s
          on:
            op: =
            leftColumn:
              name: seasonId
              table: e
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: seasonId
              table: e
          - op: =
            leftColumn:
              name: state
              table: s
          - op: =
            leftColumn:
              name: episodeId
              table: e
          - op: <
            leftColumn:
              name: publishTimeMs
              table: e
      getColumns:
        - name: data
          table: e
    - name: ListNextPublishedEpisodesForConsumer
      table:
        name: Episode
        as: e
      join:
        - type: INNER
          table:
            name: Season
            as: s
          on:
            op: =
            leftColumn:
              name: seasonId
              table: e
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: seasonId
              table: e
          - op: =
            leftColumn:
              name: state
              table: s
          - op: ">"
            leftColumn:
              name: index
              table: e
          - op: <
            leftColumn:
              name: publishTimeMs
              table: e
      orderBy:
        - column:
            name: index
            table: e
      withLimit: true
      getColumns:
        - name: data
          table: e
    - name: ListPrevPublishedEpisodesForConsumer
      table:
        name: Episode
        as: e
      join:
        - type: INNER
          table:
            name: Season
            as: s
          on:
            op: =
            leftColumn:
              name: seasonId
              table: e
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: seasonId
              table: e
          - op: =
            leftColumn:
              name: state
              table: s
          - op: "<"
            leftColumn:
              name: index
              table: e
          - op: <
            leftColumn:
              name: publishTimeMs
              table: e
      orderBy:
        - column:
            name: index
            table: e
          desc: true
      withLimit: true
      getColumns:
        - name: data
          table: e
    - name: ListPrevEpisodesForPublisher
      table:
        name: Episode
        as: e
      join:
        - type: INNER
          table:
            name: Season
            as: s
          on:
            op: =
            leftColumn:
              name: seasonId
              table: e
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: publisherId
              table: s
          - op: =
            leftColumn:
              name: seasonId
              table: e
          - op: "<"
            leftColumn:
              name: index
              table: e
      orderBy:
        - column:
            name: index
            table: e
          desc: true
      withLimit: true
      getColumns:
        - name: data
          table: e
    - name: ListNextEpisodesForPublisher
      table:
        name: Episode
        as: e
      join:
        - type: INNER
          table:
            name: Season
            as: s
          on:
            op: =
            leftColumn:
              name: seasonId
              table: e
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: publisherId
              table: s
          - op: =
            leftColumn:
              name: seasonId
              table: e
          - op: ">"
            leftColumn:
              name: index
              table: e
      orderBy:
        - column:
            name: index
            table: e
      withLimit: true
      getColumns:
        - name: data
          table: e
    - name: GetEpisodeForPublisher
      table:
        name: Episode
        as: e
      join:
        - type: INNER
          table:
            name: Season
            as: s
          on:
            op: =
            leftColumn:
              name: seasonId
              table: e
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: publisherId
              table: s
          - op: =
            leftColumn:
              name: seasonId
              table: e
          - op: =
            leftColumn:
              name: episodeId
              table: e
      getColumns:
        - name: data
          table: e
    - name: GetSeasonAndEpisode
      table:
        name: Episode
        as: e
      join:
        - type: INNER
          table:
            name: Season
            as: s
          on:
            op: =
            leftColumn:
              name: seasonId
              table: e
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: seasonId
              table: e
          - op: =
            leftColumn:
              name: episodeId
              table: e
      getColumns:
        - name: data
          table: s
        - name: data
          table: e
    - name: GetSeasonAndEpisodeForPublisher
      table:
        name: Episode
        as: e
      join:
        - type: INNER
          table:
            name: Season
            as: s
          on:
            op: =
            leftColumn:
              name: seasonId
              table: e
            rightColumn: seasonId
      where:
        op: AND
        exps:
          - op: =
            leftColumn:
              name: publisherId
              table: s
          - op: =
            leftColumn:
              name: seasonId
              table: e
          - op: =
            leftColumn:
              name: episodeId
              table: e
      getColumns:
        - name: data
          table: s
        - name: data
          table: e
    # CoverImageFile
    - name: CheckPresenceOfCoverImageFile
      table: CoverImageFile
      where:
        op: =
        leftColumn: r2Filename
      getColumns:
        - r2Filename
    # VideoContainerKey
    - name: CheckPresenceOfVideoContainerKey
      table: VideoContainerKey
      where:
        op: =
        leftColumn: key
      getColumns:
        - key
  outputDdl: ./db/ddl
  outputSql: ./db/sql
