- kind: SpannerDatabase
  name: ProductDatabase
  tables:
    - kind: Table
      name: Season
      columns:
        - name: seasonId
          type: string
        - name: publisherId
          type: string
          nullable: true
        - name: state
          type: SeasonState
          import: "@phading/product_service_interface/show/season_state"
          nullable: true
        - name: takenDownReason
          type: string
          nullable: true
        - name: name
          type: string
          nullable: true
        - name: coverImageR2Filename
          type: string
          nullable: true
        - name: totalPublishedEpisodes
          type: float64
          nullable: true
        - name: lastChangeTimeMs
          type: float64
          nullable: true
        - name: recentPremiereTimeMs
          type: float64
          nullable: true
        - name: description
          type: string
          nullable: true
        - name: createdTimeMs
          type: int53
        - name: publishedTimeMs
          type: float64
          nullable: true
        - name: totalRatings
          type: float64
          nullable: true
        - name: ratingsCount
          type: float64
          nullable: true
        - name: averageRating
          type: float64
          nullable: true
        - name: ratingUpdatedTimeMs
          type: float64
          nullable: true
      columnGroups:
        - name: main
          columns:
            - seasonId
            - publisherId
            - state
            - name
            - coverImageR2Filename
            - totalPublishedEpisodes
            - lastChangeTimeMs
            - recentPremiereTimeMs
            - ratingsCount
            - averageRating
        - name: rating
          columns:
            - totalRatings
            - ratingsCount
            - averageRating
            - ratingUpdatedTimeMs
      searchColumns:
        - name: fullText
          columnRefs:
            - name
            - description
      primaryKeys:
        - seasonId
      indexes:
        - name: ByPublisherAndStateAndLastChangeTimeMs
          columns:
            - publisherId
            - state
            - name: lastChangeTimeMs
              desc: true
        - name: ByPublisherLastChangeTimeMs
          columns:
            - publisherId
            - name: lastChangeTimeMs
              desc: true
        - name: ByRecentPremiereTimeMs
          columns:
            - state
            - name: recentPremiereTimeMs
              desc: true
            - name: createdTimeMs
              desc: true
        - name: ByPublisherRecentPremiereTimeMs
          columns:
            - publisherId
            - state
            - name: recentPremiereTimeMs
              desc: true
            - name: createdTimeMs
              desc: true
        - name: ByAverageRating
          columns:
            - state
            - name: averageRating
              desc: true
            - name: createdTimeMs
              desc: true
        - name: ByPublisherAverageRating
          columns:
            - publisherId
            - state
            - name: averageRating
              desc: true
            - name: createdTimeMs
              desc: true
      searchIndexes:
        - name: ByFullText
          columns:
            - fullText
          orderByColumns:
            - createdTimeMs
          partitionByColumns:
            - state
        - name: ByPublisherOnlyAndFullText
          columns:
            - fullText
          orderByColumns:
            - createdTimeMs
          partitionByColumns:
            - publisherId
      insert: InsertSeason
      delete: DeleteSeason
      get: GetSeason
    - kind: Table
      name: SeasonGrade
      columns:
        - name: seasonId
          type: string
        - name: gradeId
          type: string
        - name: startDate # ISO string. Inclusive.
          type: string
          nullable: true
        - name: endDate # ISO string. Exclusive.
          type: string
          nullable: true
        - name: grade # From 1 to 99. A multiplier on the base price.
          type: float64
          nullable: true
      primaryKeys:
        - seasonId
        - gradeId
      interleave:
        parentTable: Season
        cascadeOnDelete: true
      indexes:
        - name: ByEndDate
          columns:
            - name: endDate
              desc: true
            - startDate
      insert: InsertSeasonGrade
      delete: DeleteSeasonGrade
    - kind: Table
      name: Episode
      columns:
        - name: seasonId
          type: string
        - name: episodeId
          type: string
        - name: index
          type: float64
          nullable: true
        - name: name
          type: string
          nullable: true
        - name: videoContainerId
          type: string
          nullable: true
        - name: videoContainerCached
          type: VideoContainerCached
          import: "@phading/product_service_interface/show/video_container_cached"
          nullable: true
        - name: state
          type: EpisodeState
          import: "@phading/product_service_interface/show/episode_state"
          nullable: true
        - name: premiereTimeMs
          type: float64
          nullable: true
      primaryKeys:
        - seasonId
        - episodeId
      interleave:
        parentTable: Season
        cascadeOnDelete: true
      indexes:
        - name: ByIndex
          columns:
            - seasonId
            - state
            - name: index
              desc: true
        - name: ByPremiereTimeMs
          columns:
            - seasonId
            - name: premiereTimeMs
              desc: true
      insert: InsertEpisode
      delete: DeleteEpisode
      get: GetEpisode
    - kind: Table
      name: IndividualSeasonRating
      columns:
        - name: raterId
          type: string
        - name: seasonId
          type: string
        - name: rating
          type: float64
          nullable: true
        - name: ratedTimeMs
          type: float64
          nullable: true
      primaryKeys:
        - raterId
        - seasonId
      insert: InsertIndividualSeasonRating
      delete: DeleteIndividualSeasonRating
      get: GetIndividualSeasonRating
      update: UpdateIndividualSeasonRating
    - kind: Table
      name: SeasonFlagReport
      columns:
        - name: reporterId
          type: string
        - name: seasonId
          type: string
        - name: reason
          type: SeasonFlagReason
          import: "@phading/product_service_interface/show/season_flag_reason"
          nullable: true
        - name: comment
          type: string
          nullable: true
        - name: flagTimeMs
          type: float64
          nullable: true
      primaryKeys:
        - reporterId
        - seasonId
      insert: InsertSeasonFlagReport
      delete: DeleteSeasonFlagReport
      get: GetSeasonFlagReport
    - kind: Table
      name: CoverImageFile
      columns:
        - name: r2Filename
          type: string
      primaryKeys:
        - r2Filename
      insert: InsertCoverImageFile
      delete: DeleteCoverImageFile
      get: GetCoverImageFile
    - kind: Table
      name: VideoContainerKey
      columns:
        - name: key
          type: string
      primaryKeys:
        - key
      insert: InsertVideoContainerKey
      delete: DeleteVideoContainerKey
      get: GetVideoContainerKey
    - kind: TaskTable
      name: VideoContainerDeletingTask
      columns:
        - name: videoContainerId
          type: string
      retryCountColumn: retryCount
      executionTimeColumn: executionTimeMs
      createdTimeColumn: createdTimeMs
      primaryKeys:
        - videoContainerId
      executionTimeIndex: VideoContainerDeletingTaskByExecutionTimeMs
      insert: InsertVideoContainerDeletingTask
      delete: DeleteVideoContainerDeletingTask
      get: GetVideoContainerDeletingTask
      listPendingTasks: ListPendingVideoContainerDeletingTasks
      getMetadata: GetVideoContainerDeletingTaskMetadata
      updateMetadata: UpdateVideoContainerDeletingTaskMetadata
    - kind: TaskTable
      name: CoverImageDeletingTask
      columns:
        - name: r2Filename
          type: string
      retryCountColumn: retryCount
      executionTimeColumn: executionTimeMs
      createdTimeColumn: createdTimeMs
      primaryKeys:
        - r2Filename
      executionTimeIndex: CoverImageDeletingTaskByExecutionTimeMs
      insert: InsertCoverImageDeletingTask
      delete: DeleteCoverImageDeletingTask
      get: GetCoverImageDeletingTask
      listPendingTasks: ListPendingCoverImageDeletingTasks
      getMetadata: GetCoverImageDeletingTaskMetadata
      updateMetadata: UpdateCoverImageDeletingTaskMetadata
    - kind: TaskTable
      name: SeasonRecentPremiereTimeUpdatingTask
      columns:
        - name: seasonId
          type: string
        - name: episodeId
          type: string
        - name: premiereTimeMs
          type: float64
      retryCountColumn: retryCount
      executionTimeColumn: executionTimeMs
      createdTimeColumn: createdTimeMs
      primaryKeys:
        - seasonId
        - episodeId
        - premiereTimeMs
      executionTimeIndex: SeasonRecentPremiereTimeUpdatingTaskByExecutionTimeMs
      insert: InsertSeasonRecentPremiereTimeUpdatingTask
      delete: DeleteSeasonRecentPremiereTimeUpdatingTask
      get: GetSeasonRecentPremiereTimeUpdatingTask
      listPendingTasks: ListPendingSeasonRecentPremiereTimeUpdatingTasks
      getMetadata: GetSeasonRecentPremiereTimeUpdatingTaskMetadata
      updateMetadata: UpdateSeasonRecentPremiereTimeUpdatingTaskMetadata
  deletes:
    - name: DeleteAllEpisodes
      table: Episode
      where:
        op: =
        lColumn: seasonId
    - name: DeleteSeasonRecentPremiereTimeUpdatingTasksOfSeason
      table: SeasonRecentPremiereTimeUpdatingTask
      where:
        op: =
        lColumn: seasonId
    - name: DeleteSeasonRecentPremiereTimeUpdatingTasksOfEpisode
      table: SeasonRecentPremiereTimeUpdatingTask
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: episodeId
  updates:
    - name: UpdateSeasonLastChangeTime
      table: Season
      where:
        op: =
        lColumn: seasonId
      set:
        - lastChangeTimeMs
    - name: ArchiveSeason
      table: Season
      where:
        op: =
        lColumn: seasonId
      set:
        - state
        - coverImageR2Filename
        - lastChangeTimeMs
    - name: UpdateSeasonTotalPublishedEpisodes
      table: Season
      where:
        op: =
        lColumn: seasonId
      set:
        - totalPublishedEpisodes
        - lastChangeTimeMs
    - name: PublishSeason
      table: Season
      where:
        op: =
        lColumn: seasonId
      set:
        - state
        - totalPublishedEpisodes
        - lastChangeTimeMs
        - publishedTimeMs
    - name: TakeDownSeason # Restore as well
      table: Season
      where:
        op: =
        lColumn: seasonId
      set:
        - state
        - takenDownReason
    - name: UpdateSeasonRecentPremiereTime
      table: Season
      where:
        op: =
        lColumn: seasonId
      set:
        - recentPremiereTimeMs
    - name: UpdateSeasonNameAndDescription
      table: Season
      where:
        op: =
        lColumn: seasonId
      set:
        - name
        - description
        - lastChangeTimeMs
    - name: UpdateSeasonCoverImage
      table: Season
      where:
        op: =
        lColumn: seasonId
      set:
        - coverImageR2Filename
        - lastChangeTimeMs
    - name: UpdateSeasonRating
      table: Season
      where:
        op: =
        lColumn: seasonId
      set:
        - totalRatings
        - ratingsCount
        - averageRating
        - ratingUpdatedTimeMs
    - name: UpdateSeasonGrade
      table: SeasonGrade
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: gradeId
      set:
        - grade
    - name: UpdateSeasonGradeEndDate
      table: SeasonGrade
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: gradeId
      set:
        - endDate
    - name: UpdateSeasonGradeStartDateAndGrade
      table: SeasonGrade
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: gradeId
      set:
        - startDate
        - grade
    - name: UpdateEpisodeVideoContainerId
      table: Episode
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: episodeId
      set:
        - videoContainerId
    - name: UpdateEpisodeVideoContainerCached
      table: Episode
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: episodeId
      set:
        - videoContainerCached
    - name: UpdateEpisodeIndex
      table: Episode
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: episodeId
      set:
        - index
    - name: PublishEpisode # Unpublish as well
      table: Episode
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: episodeId
      set:
        - state
        - index
        - premiereTimeMs
    - name: UpdateEpisodeName
      table: Episode
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: episodeId
      set:
        - name
    - name: UpdateEpisodePremiereTime
      table: Episode
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: episodeId
      set:
        - premiereTimeMs
  selects:
    # Season
    - name: CheckPresenceOfSeason
      from: Season
      where:
        op: =
        lColumn: seasonId
      get:
        - lastChangeTimeMs
    - name: GetSeasonPublisher
      from: Season
      where:
        op: =
        lColumn: seasonId
      get:
        - publisherId
    - name: GetSeasonName
      from: Season
      where:
        op: =
        lColumn: seasonId
      get:
        - name
    - name: GetSeasonRecentPremiereTime
      from: Season
      where:
        op: =
        lColumn: seasonId
      get:
        - recentPremiereTimeMs
    - name: GetSeasonForPublisher
      from: Season
      where:
        op: AND
        exprs:
          - op: =
            lColumn: publisherId
          - op: =
            lColumn: seasonId
      get:
        - columnGroup: main
    - name: GetSeasonAllForPublisher
      from: Season
      where:
        op: AND
        exprs:
          - op: =
            lColumn: publisherId
          - op: =
            lColumn: seasonId
      get:
        - all: true
    - name: ListSeasonsForPublisher
      from: Season
      where:
        op: AND
        exprs:
          - op: =
            lColumn: publisherId
          - op: <
            lColumn: lastChangeTimeMs
      orderBy:
        - column: lastChangeTimeMs
          desc: true
      withLimit: true
      get:
        - columnGroup: main
    - name: ListSeasonsByStateForPublisher
      from: Season
      where:
        op: AND
        exprs:
          - op: =
            lColumn: publisherId
          - op: =
            lColumn: state
          - op: <
            lColumn: lastChangeTimeMs
      orderBy:
        - column: lastChangeTimeMs
          desc: true
      withLimit: true
      get:
        - columnGroup: main
    - name: SearchSeasonsForPublisher
      from: Season
      where:
        op: AND
        exprs:
          - op: =
            lColumn: publisherId
          - op: SEARCH
            lColumn: fullText
      orderBy:
        - func: SCORE
          column: fullText
          desc: true
        - createdTimeMs
      withLimit: true
      get:
        - columnGroup: main
        - func: SCORE
          column: fullText
        - createdTimeMs
    - name: ContinuedSearchSeasonsForPublisher
      from: Season
      where:
        op: AND
        exprs:
          - op: =
            lColumn: publisherId
          - op: SEARCH
            lColumn: fullText
          - op: OR
            exprs:
              - op: <
                func: SCORE
                lColumn: fullText
              - op: AND
                exprs:
                  - op: =
                    func: SCORE
                    lColumn: fullText
                  - op: ">"
                    lColumn: createdTimeMs
      orderBy:
        - func: SCORE
          column: fullText
          desc: true
        - createdTimeMs
      withLimit: true
      get:
        - columnGroup: main
        - func: SCORE
          column: fullText
        - createdTimeMs
    - name: ListPublishedSeasonsByPremiereTime
      from: Season
      where:
        op: AND
        exprs:
          - op: =
            lColumn: state
          - op: OR
            exprs:
              - op: <
                lColumn: recentPremiereTimeMs
              - op: AND
                exprs:
                  - op: =
                    lColumn: recentPremiereTimeMs
                  - op: <
                    lColumn: createdTimeMs
      orderBy:
        - column: recentPremiereTimeMs
          desc: true
        - column: createdTimeMs
          desc: true
      withLimit: true
      get:
        - columnGroup: main
        - createdTimeMs
    - name: ListPublishedSeasonsByRating
      from: Season
      where:
        op: AND
        exprs:
          - op: =
            lColumn: state
          - op: OR
            exprs:
              - op: <
                lColumn: averageRating
              - op: AND
                exprs:
                  - op: =
                    lColumn: averageRating
                  - op: <
                    lColumn: createdTimeMs
      orderBy:
        - column: averageRating
          desc: true
        - column: createdTimeMs
          desc: true
      withLimit: true
      get:
        - columnGroup: main
        - createdTimeMs
    - name: ListPublishedSeasonsByPremiereTimeAndPublisher
      from: Season
      where:
        op: AND
        exprs:
          - op: =
            lColumn: state
          - op: =
            lColumn: publisherId
          - op: OR
            exprs:
              - op: <
                lColumn: recentPremiereTimeMs
              - op: AND
                exprs:
                  - op: =
                    lColumn: recentPremiereTimeMs
                  - op: <
                    lColumn: createdTimeMs
      orderBy:
        - column: recentPremiereTimeMs
          desc: true
        - column: createdTimeMs
          desc: true
      withLimit: true
      get:
        - columnGroup: main
        - createdTimeMs
    - name: ListPublishedSeasonsByRatingAndPublisher
      from: Season
      where:
        op: AND
        exprs:
          - op: =
            lColumn: state
          - op: =
            lColumn: publisherId
          - op: OR
            exprs:
              - op: <
                lColumn: averageRating
              - op: AND
                exprs:
                  - op: =
                    lColumn: averageRating
                  - op: <
                    lColumn: createdTimeMs
      orderBy:
        - column: averageRating
          desc: true
        - column: createdTimeMs
          desc: true
      withLimit: true
      get:
        - columnGroup: main
        - createdTimeMs
    - name: GetPublishedSeason
      from: Season
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: state
      get:
        - columnGroup: main
    - name: GetPublishedSeasonAndEpisode
      from: Season
      as: s
      join:
        - type: INNER
          with: Episode
          as: e
          on:
            op: =
            lColumn: seasonId
            lTable: s
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
            lTable: s
          - op: =
            lColumn: state
            lTable: s
          - op: =
            lColumn: episodeId
            lTable: e
          - op: =
            lColumn: state
            lTable: e
      get:
        - columnGroup: main
          table: s
        - all: true
          table: e
    - name: GetPublishedSeasonAll
      from: Season
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: state
      get:
        - all: true
    - name: GetPublishedSeasonRating
      from: Season
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: state
      get:
        - columnGroup: rating
    - name: SearchPublishedSeasons
      from: Season
      where:
        op: AND
        exprs:
          - op: =
            lColumn: state
          - op: SEARCH
            lColumn: fullText
      orderBy:
        - func: SCORE
          column: fullText
          desc: true
        - createdTimeMs
      withLimit: true
      get:
        - columnGroup: main
        - func: SCORE
          column: fullText
        - createdTimeMs
    - name: ContinuedSearchPublishedSeasons
      from: Season
      where:
        op: AND
        exprs:
          - op: =
            lColumn: state
          - op: SEARCH
            lColumn: fullText
          - op: OR
            exprs:
              - op: <
                func: SCORE
                lColumn: fullText
              - op: AND
                exprs:
                  - op: =
                    func: SCORE
                    lColumn: fullText
                  - op: ">"
                    lColumn: createdTimeMs
      orderBy:
        - func: SCORE
          column: fullText
          desc: true
        - createdTimeMs
      withLimit: true
      get:
        - columnGroup: main
        - func: SCORE
          column: fullText
        - createdTimeMs
    # SeasonGrade
    - name: GetSeasonGrade
      from: SeasonGrade
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: "<="
            lColumn: startDate
          - op: ">"
            lColumn: endDate
      get:
        - all: true
    - name: GetLastSeasonGrades
      from: SeasonGrade
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: ">"
            lColumn: endDate
      orderBy:
        - column: endDate
          desc: true
      withLimit: true
      get:
        - all: true
    # Episode
    - name: CheckPresenceOfEpisode
      from: Episode
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
          - op: =
            lColumn: episodeId
      get:
        - state
    - name: GetPublishedEpisode
      from: Episode
      as: e
      join:
        - type: INNER
          with: Season
          as: s
          on:
            op: =
            lColumn: seasonId
            lTable: e
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
            lTable: e
          - op: =
            lColumn: state
            lTable: s
          - op: =
            lColumn: episodeId
            lTable: e
          - op: =
            lColumn: state
            lTable: e
      get:
        - all: true
          table: e
    - name: ListNextPublishedEpisodes
      from: Episode
      as: e
      join:
        - type: INNER
          with: Season
          as: s
          on:
            op: =
            lColumn: seasonId
            lTable: e
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
            lTable: e
          - op: =
            lColumn: state
            lTable: s
          - op: ">"
            lColumn: index
            lTable: e
          - op: =
            lColumn: state
            lTable: e
      orderBy:
        - column: index
          table: e
      withLimit: true
      get:
        - all: true
          table: e
    - name: ListPrevPublishedEpisodes
      from: Episode
      as: e
      join:
        - type: INNER
          with: Season
          as: s
          on:
            op: =
            lColumn: seasonId
            lTable: e
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: seasonId
            lTable: e
          - op: =
            lColumn: state
            lTable: s
          - op: "<"
            lColumn: index
            lTable: e
          - op: =
            lColumn: state
            lTable: e
      orderBy:
        - column: index
          table: e
          desc: true
      withLimit: true
      get:
        - all: true
          table: e
    - name: ListPrevPublishedEpisodesForPublisher
      from: Episode
      as: e
      join:
        - type: INNER
          with: Season
          as: s
          on:
            op: =
            lColumn: seasonId
            lTable: e
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: publisherId
            lTable: s
          - op: =
            lColumn: seasonId
            lTable: e
          - op: =
            lColumn: state
            lTable: e
          - op: "<"
            lColumn: index
            lTable: e
      orderBy:
        - column: index
          table: e
          desc: true
      withLimit: true
      get:
        - all: true
          table: e
    - name: ListNextPublishedEpisodesForPublisher
      from: Episode
      as: e
      join:
        - type: INNER
          with: Season
          as: s
          on:
            op: =
            lColumn: seasonId
            lTable: e
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: publisherId
            lTable: s
          - op: =
            lColumn: seasonId
            lTable: e
          - op: =
            lColumn: state
            lTable: e
          - op: ">"
            lColumn: index
            lTable: e
      orderBy:
        - column: index
          table: e
      withLimit: true
      get:
        - all: true
          table: e
    - name: ListDraftEpisodesForPublisher
      from: Episode
      as: e
      join:
        - type: INNER
          with: Season
          as: s
          on:
            op: =
            lColumn: seasonId
            lTable: e
            rColumn: seasonId
      where:
        op: AND
        exprs:
          - op: =
            lColumn: publisherId
            lTable: s
          - op: =
